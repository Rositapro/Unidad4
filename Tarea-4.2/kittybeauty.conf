<VirtualHost *:80>
    ServerName kittybeauty.local
    Redirect permanent / https://kittybeauty.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName kittybeauty.local
    DocumentRoot /var/www/kittybeauty

    SSLEngine on 
    SSLCertificateFile /etc/ssl/certs/kittybeauty.crt
    SSLCertificateKeyFile /etc/ssl/private/kittybeauty.key
</VirtualHost>
